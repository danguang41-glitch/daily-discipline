<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Discipline AI</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f7;
    margin: 0;
    padding: 30px;
}

.card {
    background: white;
    max-width: 500px;
    margin: auto;
    padding: 30px;
    border-radius: 25px;
    box-shadow: 0 10px 30px #ddd;
}

h1 {
    text-align: center;
}

.progress {
    background: #eee;
    border-radius: 20px;
    height: 20px;
}

.bar {
    background: #34c759;
    width: 70%;
    height: 100%;
    border-radius: 20px;
}

.task {
    background: #f2f2f7;
    padding: 15px;
    margin: 10px 0;
    border-radius: 15px;
}

button {
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#007aff;
    color:white;
    font-size:18px;
}
</style>

</head>

<body>

<div class="card">

<h1>🚀 Daily Discipline AI</h1>

<p>早上好，广蛋 👋</p>

<h3>今日完成率 70%</h3>

<div class="progress">
<div class="bar"></div>
</div>


<div class="task">
✅ 英语学习 3小时
</div>

<div class="task">
☐ 运动30分钟
</div>

<div class="task">
☐ 少刷短视频
</div>

<div class="task">
☐ 阅读20分钟
</div>


<button>
开始今天的自律
</button>


</div>


</body>
</html>
